<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="54%" r="52%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.55" />
      <stop offset="65%" stop-color="#090D16" stop-opacity="1" />
      <stop offset="100%" stop-color="#06090F" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="emeraldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="coreFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
  </defs>

  <!-- Deep Studio Obsidian Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1E293B" stroke-width="4" />

  <!-- Subtle Top 3-Signal Sovereign Trio Pips (Red: Speak · Amber: Serve · Green: Heard) -->
  <g transform="translate(0, 4)">
    <circle cx="216" cy="76" r="11" fill="#EF4444" />
    <circle cx="256" cy="76" r="11" fill="#F59E0B" />
    <circle cx="296" cy="76" r="11" fill="#10B981" />
  </g>

  <!-- Primary Sovereign Green Checkmark Beacon (Centered in Safe Zone) -->
  <circle cx="256" cy="276" r="148" fill="url(#coreFill)" stroke="url(#emeraldRing)" stroke-width="28" />
  <circle cx="256" cy="276" r="116" fill="none" stroke="#34D399" stroke-opacity="0.22" stroke-width="3" />

  <!-- Crisp High-Contrast Resolution Checkmark -->
  <path
    d="M 190 278 L 236 324 L 326 226"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
