<svg viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Red Lens Gradient -->
    <radialGradient id="redLensBrand" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <!-- Amber Lens Gradient -->
    <radialGradient id="amberLensBrand" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>

    <!-- Green Lens Gradient -->
    <radialGradient id="greenLensBrand" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>

    <!-- Glow Effect for Green Lens -->
    <filter id="greenGlowBrand" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="900" height="240" rx="24" fill="url(#brandBg)"/>

  <!-- 3-Signal Beacon Logo -->
  <g transform="translate(40, 20)">
    <circle cx="60" cy="100" r="36" fill="url(#redLensBrand)"/>
    <circle cx="145" cy="100" r="36" fill="url(#amberLensBrand)"/>
    <circle cx="230" cy="100" r="36" fill="url(#greenLensBrand)" filter="url(#greenGlowBrand)"/>
  </g>

  <!-- Brand Typography -->
  <text x="350" y="112" font-family="Arial, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="3">CIVICDUTY</text>
  <text x="350" y="146" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#4ade80" letter-spacing="4">• SPEAK. SERVE. BE HEARD. •</text>

  <!-- Ministry of ICT Co-Branding Badge -->
  <g transform="translate(620, 80)">
    <rect x="0" y="0" width="240" height="60" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
    <text x="18" y="24" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#94a3b8">IN PARTNERSHIP WITH</text>
    <text x="18" y="44" font-family="Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff">MINISTRY OF ICT &amp; NG</text>
  </g>
</svg>
