<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CivicDuty</title>
    <meta name="description" content="Speak. Serve. Be Heard. Civic accountability, service delivery reporting, and government desk portal for citizen reports, SLA tracking, anti-corruption, and public accountability." />
    <link rel="canonical" href="https://civicduty.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://civicduty.site/" />
    <meta property="og:site_name" content="CivicDuty" />
    <meta property="og:title" content="CivicDuty" />
    <meta property="og:description" content="Speak. Serve. Be Heard. Civic accountability, service delivery reporting, and government desk portal for citizen reports, SLA tracking, anti-corruption, and public accountability." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CivicDuty" />
    <meta name="twitter:description" content="Speak. Serve. Be Heard. Civic accountability, service delivery reporting, and government desk portal for citizen reports, SLA tracking, anti-corruption, and public accountability." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CivicDuty",
        "url": "https://civicduty.site",
        "applicationCategory": "GovernmentApplication",
        "operatingSystem": "All",
        "description": "Speak. Serve. Be Heard. Civic accountability, service delivery reporting, and government desk portal for citizen reports, SLA tracking, anti-corruption, and public accountability."
      }
    </script>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/civicduty-logo.png" />
    
    <!-- Editorial & Broadsheet Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..700&family=Playfair+Display:ital,wght@0,600..900;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CivicDuty" />
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('CivicDuty PWA ServiceWorker active:', reg.scope))
            .catch(err => console.log('CivicDuty SW registration failed:', err));
        });
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#020617] dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950 transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
