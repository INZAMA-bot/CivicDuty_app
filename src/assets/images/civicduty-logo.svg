<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="100%" height="100%" fill="none">
  <!-- Signal 1: Red (Citizen Speaks) -->
  <g class="civic-signal-red">
    <circle cx="70" cy="60" r="38" fill="none" stroke="#EF4444" stroke-width="7" />
    <circle cx="70" cy="60" r="11.5" fill="#F87171" />
  </g>

  <!-- Signal 2: Amber (Government Serves) -->
  <g class="civic-signal-amber">
    <circle cx="180" cy="60" r="38" fill="none" stroke="#F59E0B" stroke-width="7" />
    <circle cx="180" cy="60" r="11.5" fill="#FDE047" />
  </g>

  <!-- Signal 3: Green (Citizen Heard & Proof Uploaded) -->
  <g class="civic-signal-green">
    <circle cx="290" cy="60" r="38" fill="#064E3B" stroke="#10B981" stroke-width="7" />
    <path d="M 273 60.5 L 286 73.5 L 308 49.5" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>