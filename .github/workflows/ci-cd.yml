name: CivicDuty Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Validation
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build
        env:
          NODE_ENV: production

  deploy-cloud-run:
    name: Deploy to Google Cloud Run
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Artifact Registry
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

      - name: Build & Push Docker Image
        run: |
          IMAGE_TAG="europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/civicduty/app:${{ github.sha }}"
          docker build -t $IMAGE_TAG -t "europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/civicduty/app:latest" .
          docker push --all-tags "europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/civicduty/app"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy civicduty-production \
            --image "europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/civicduty/app:${{ github.sha }}" \
            --region europe-west2 \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 10 \
            --set-env-vars NODE_ENV=production
